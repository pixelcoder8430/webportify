<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webportify - Cart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background:
        linear-gradient(rgba(2,7,13,.88), rgba(2,7,13,.95)),
        url("wallpaper.jpg");
    background-size: cover;
    background-position: center;
    color: white;
}

/* HEADER */
header {
    height: 75px;
    padding: 0 45px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ff1744;
    background: rgba(0,0,0,.75);
    box-shadow: 0 0 20px rgba(255,23,68,.25);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ff1744;
    text-shadow: 0 0 12px #ff1744;
}

.dashboard-btn {
    text-decoration: none;
    color: white;
    border: 1px solid #ff1744;
    padding: 10px 20px;
    border-radius: 10px;
    transition: .3s;
}

.dashboard-btn:hover {
    background: #ff1744;
    box-shadow: 0 0 18px #ff1744;
}

/* MAIN */
.container {
    width: 90%;
    max-width: 1100px;
    margin: 50px auto;
}

.title {
    font-size: 38px;
    margin-bottom: 30px;
    color: #ff1744;
    text-shadow: 0 0 15px #ff1744;
}

/* CART */
.cart-box {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 30px;
}

.items {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.cart-item {
    background: rgba(10,15,22,.9);
    border: 1px solid rgba(255,23,68,.5);
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 0 15px rgba(255,23,68,.12);
}

.cart-item h2 {
    color: #ff1744;
    margin-bottom: 10px;
}

.cart-item p {
    color: #bbb;
    margin: 7px 0;
}

.price {
    font-size: 22px;
    font-weight: bold;
    color: white;
    margin-top: 15px;
}

.remove-btn {
    margin-top: 15px;
    padding: 9px 16px;
    border: 1px solid #ff1744;
    background: transparent;
    color: #ff1744;
    border-radius: 8px;
    cursor: pointer;
    transition: .3s;
}

.remove-btn:hover {
    background: #ff1744;
    color: white;
}

/* SUMMARY */
.summary {
    background: rgba(10,15,22,.95);
    border: 1px solid #ff1744;
    border-radius: 15px;
    padding: 28px;
    height: fit-content;
    box-shadow: 0 0 25px rgba(255,23,68,.2);
}

.summary h2 {
    color: #ff1744;
    margin-bottom: 25px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
    color: #ccc;
}

.total {
    border-top: 1px solid #444;
    padding-top: 18px;
    margin-top: 20px;
    font-size: 23px;
    color: white;
    font-weight: bold;
}

.checkout-btn {
    width: 100%;
    padding: 14px;
    margin-top: 25px;
    border: none;
    border-radius: 10px;
    background: #ff1744;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255,23,68,.5);
    transition: .3s;
}

.checkout-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px #ff1744;
}

/* EMPTY */
.empty {
    text-align: center;
    padding: 70px 20px;
    background: rgba(10,15,22,.9);
    border: 1px solid #333;
    border-radius: 15px;
}

.empty h2 {
    font-size: 30px;
    margin-bottom: 15px;
}

.empty p {
    color: #aaa;
    margin-bottom: 25px;
}

.browse-btn {
    display: inline-block;
    text-decoration: none;
    padding: 12px 25px;
    border-radius: 10px;
    background: #ff1744;
    color: white;
    font-weight: bold;
}

/* RESPONSIVE */
@media(max-width: 800px) {

    .cart-box {
        grid-template-columns: 1fr;
    }

    header {
        padding: 0 20px;
    }

    .container {
        width: 92%;
    }

    .title {
        font-size: 32px;
    }
}
</style>

</head>

<body>

<header>

```
<div class="logo">
    WEBPORTIFY
</div>

<a href="customer_dashboard.html" class="dashboard-btn">
    ← Dashboard
</a>
```

</header>

<div class="container">

```
<h1 class="title">
    🛒 Your Cart
</h1>

<div id="cartContent"></div>
```

</div>

<script>

/* =========================
   CUSTOMER LOGIN PROTECTION
========================= */

if (localStorage.getItem("customerLoggedIn") !== "true") {

    window.location.replace("Structure.html");

}


/* =========================
   READ CART
========================= */

function getCart() {

    try {

        const savedCart =
            localStorage.getItem("webportifyCart");

        const cart =
            savedCart ? JSON.parse(savedCart) : [];

        return Array.isArray(cart) ? cart : [];

    } catch (error) {

        console.error("Cart data error:", error);

        return [];

    }

}


/* =========================
   LOAD CART
========================= */

function loadCart() {

    const cart = getCart();

    const cartContent =
        document.getElementById("cartContent");

    if (cart.length === 0) {

        cartContent.innerHTML = `
            <div class="empty">

                <h2>Your cart is empty</h2>

                <p>
                    Choose a website template
                    from the dashboard.
                </p>

                <a
                    href="customer_dashboard.html"
                    class="browse-btn">
                    Browse Websites
                </a>

            </div>
        `;

        return;
    }

    let subtotal = 0;

    let itemsHTML = "";

    cart.forEach((item, index) => {

        const price =
            Number(item.price) || 0;

        subtotal += price;

        itemsHTML += `
            <div class="cart-item">

                <h2>
                    ${escapeHTML(
                        item.name || "Website"
                    )}
                </h2>

                <p>
                    Website Type:
                    ${escapeHTML(
                        item.type || "Website"
                    )}
                </p>

                <p>
                    Description:
                    ${escapeHTML(
                        item.description ||
                        "Premium website template"
                    )}
                </p>

                <div class="price">
                    ₹${price.toLocaleString("en-IN")}
                </div>

                <button
                    class="remove-btn"
                    data-index="${index}"
                    onclick="removeItem(this.dataset.index)">
                    Remove
                </button>

            </div>
        `;

    });

    cartContent.innerHTML = `

        <div class="cart-box">

            <div class="items">
                ${itemsHTML}
            </div>

            <div class="summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">
                    <span>Items</span>
                    <span>${cart.length}</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>

                    <span>
                        ₹${subtotal.toLocaleString("en-IN")}
                    </span>
                </div>

                <div class="summary-row">
                    <span>Service Fee</span>
                    <span>₹0</span>
                </div>

                <div class="summary-row total">

                    <span>Total</span>

                    <span>
                        ₹${subtotal.toLocaleString("en-IN")}
                    </span>

                </div>

                <button
                    class="checkout-btn"
                    onclick="checkout()">
                    Proceed to Checkout
                </button>

            </div>

        </div>

    `;

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index) {

    const cart = getCart();

    const itemIndex =
        Number(index);

    if (
        itemIndex < 0 ||
        itemIndex >= cart.length
    ) {
        return;
    }

    cart.splice(itemIndex, 1);

    localStorage.setItem(
        "webportifyCart",
        JSON.stringify(cart)
    );

    loadCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    const cart = getCart();

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;

    }

    window.location.href =
        "customer_checkout.html";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   START
========================= */

loadCart();

</script>

</body>
</html>
