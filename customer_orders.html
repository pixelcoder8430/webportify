<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webportify | My Orders</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        linear-gradient(
            rgba(2,7,13,.94),
            rgba(2,7,13,.97)
        ),
        url("wallpaper.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    padding:30px 18px;
    background:rgba(5,8,13,.98);
    border-right:1px solid #ff1744;
    box-shadow:5px 0 25px rgba(255,23,68,.15);
}

.logo{
    text-align:center;
    color:#ff1744;
    font-size:27px;
    font-weight:bold;
    margin-bottom:45px;
    text-shadow:0 0 15px #ff1744;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:9px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 15px;
    color:#bfc3ca;
    text-decoration:none;
    border-radius:10px;
    transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
    color:white;
    background:rgba(255,23,68,.12);
    box-shadow:0 0 15px rgba(255,23,68,.12);
}

.sidebar a.active{
    border-left:3px solid #ff1744;
}

.icon{
    width:25px;
    text-align:center;
    font-size:18px;
}

.message-badge{
    margin-left:auto;
    min-width:20px;
    padding:3px 7px;
    border-radius:20px;
    background:#ff1744;
    color:white;
    font-size:11px;
    text-align:center;
    display:none;
}

.main{
    margin-left:250px;
    padding:35px 45px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    gap:20px;
}

.top h1{
    font-size:34px;
    margin-bottom:8px;
}

.top h1 span{
    color:#ff1744;
    text-shadow:0 0 12px #ff1744;
}

.top p{
    color:#999;
    font-size:14px;
}

.top-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    border:none;
    padding:12px 18px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    text-decoration:none;
    transition:.3s;
    display:inline-block;
}

.dark-btn{
    background:#11161e;
    color:white;
    border:1px solid #303640;
}

.dark-btn:hover{
    border-color:#ff1744;
    color:#ff1744;
}

.red-btn{
    background:#ff1744;
    color:white;
    box-shadow:0 0 15px rgba(255,23,68,.25);
}

.red-btn:hover{
    box-shadow:0 0 25px rgba(255,23,68,.6);
    transform:translateY(-2px);
}

.search-section{
    display:flex;
    gap:12px;
    margin-bottom:30px;
}

.search-box{
    flex:1;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    background:rgba(9,13,20,.95);
    border:1px solid #303640;
    border-radius:10px;
    color:white;
    outline:none;
    font-size:14px;
}

.search-box input:focus{
    border-color:#ff1744;
    box-shadow:0 0 15px rgba(255,23,68,.15);
}

.status-filter{
    padding:0 15px;
    background:#090d14;
    color:white;
    border:1px solid #303640;
    border-radius:10px;
    outline:none;
    min-width:170px;
}

.status-filter:focus{
    border-color:#ff1744;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-title h2{
    font-size:23px;
}

.section-title span{
    color:#777;
    font-size:13px;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.order-card{
    background:rgba(9,13,20,.96);
    border:1px solid #292f38;
    border-radius:15px;
    padding:25px;
    transition:.3s;
}

.order-card:hover{
    border-color:#ff1744;
    box-shadow:0 0 22px rgba(255,23,68,.12);
}

.order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:20px;
}

.order-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.order-icon{
    width:48px;
    height:48px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#151017;
    border:1px solid rgba(255,23,68,.35);
    border-radius:12px;
    font-size:24px;
}

.order-title h3{
    font-size:20px;
    margin-bottom:5px;
}

.order-number{
    color:#777;
    font-size:12px;
}

.status{
    padding:7px 13px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    white-space:nowrap;
}

.status-pending{
    color:#ffc107;
    background:rgba(255,193,7,.10);
    border:1px solid rgba(255,193,7,.45);
}

.status-accepted,
.status-in-progress{
    color:#4da3ff;
    background:rgba(77,163,255,.10);
    border:1px solid rgba(77,163,255,.45);
}

.status-completed{
    color:#4dff88;
    background:rgba(77,255,136,.10);
    border:1px solid rgba(77,255,136,.45);
}

.status-rejected{
    color:#ff496b;
    background:rgba(255,73,107,.10);
    border:1px solid rgba(255,73,107,.45);
}

.order-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.info-box{
    background:#0c1118;
    border:1px solid #252b34;
    padding:15px;
    border-radius:9px;
}

.info-label{
    color:#777f89;
    font-size:10px;
    margin-bottom:7px;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.info-value{
    color:#eee;
    font-size:14px;
    word-break:break-word;
}

.progress-section{
    margin-top:18px;
    padding:16px;
    background:#0c1118;
    border-radius:9px;
    border:1px solid #252b34;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.progress-top span:first-child{
    color:#aaa;
    font-size:13px;
}

.progress-top span:last-child{
    color:#ff1744;
    font-weight:bold;
    font-size:13px;
}

.progress-bar{
    width:100%;
    height:8px;
    background:#20252d;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:#ff1744;
    border-radius:20px;
    box-shadow:0 0 10px rgba(255,23,68,.7);
    transition:width .5s ease;
}

.order-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid #252b34;
}

.total-label{
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}

.total-price{
    font-size:22px;
    font-weight:bold;
    color:white;
}

.order-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.empty{
    text-align:center;
    padding:80px 20px;
    background:rgba(9,13,20,.96);
    border:1px solid #252b34;
    border-radius:15px;
}

.empty-icon{
    font-size:55px;
    margin-bottom:15px;
}

.empty h2{
    color:#aaa;
    margin-bottom:10px;
}

.empty p{
    color:#777;
    font-size:14px;
    margin-bottom:22px;
}

.error-box{
    background:#180b10;
    border:1px solid #ff1744;
    border-radius:12px;
    padding:25px;
    text-align:center;
    color:#ff9bad;
}

.error-box h2{
    color:#ff1744;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    padding:70px 20px;
    color:#888;
}

.loading-icon{
    font-size:40px;
    margin-bottom:15px;
}

@media(max-width:1000px){

    .order-info{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:850px){

    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
        padding:25px;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .top-buttons{
        width:100%;
    }

}

@media(max-width:650px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid #ff1744;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .search-section{
        flex-direction:column;
    }

    .status-filter{
        height:48px;
    }

    .order-top{
        flex-direction:column;
    }

    .order-info{
        grid-template-columns:1fr;
    }

    .order-bottom{
        flex-direction:column;
        align-items:flex-start;
    }

    .order-actions{
        width:100%;
        flex-direction:column;
    }

    .order-actions .btn{
        width:100%;
        text-align:center;
    }

}

</style>

</head>

<script>

/* =====================================================
   WEBPORTIFY BACKEND
===================================================== */

const API_URL =
    "https://webportify.onrender.com";


/* =====================================================
   LOGIN PROTECTION
===================================================== */

const token =
    localStorage.getItem("token");


if(
    !token ||
    localStorage.getItem("customerLoggedIn") !== "true"
){

    localStorage.removeItem("customerLoggedIn");

    window.location.replace(
        "customer_signin.html"
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const ordersContainer =
    document.getElementById("ordersContainer");

const orderCount =
    document.getElementById("orderCount");

const searchInput =
    document.getElementById("searchInput");

const statusFilter =
    document.getElementById("statusFilter");

const customerNameElement =
    document.getElementById("customerName");


/* =====================================================
   ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(value){

    if(!value){
        return "Not available";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return String(value);
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric"
        }
    );

}


/* =====================================================
   FORMAT CURRENCY
===================================================== */

function formatCurrency(value){

    const amount =
        Number(value) || 0;

    return "₹" +
        amount.toLocaleString("en-IN");

}


/* =====================================================
   NORMALIZE STATUS
===================================================== */

function normalizeStatus(status){

    const value =
        String(
            status || "pending"
        )
        .toLowerCase()
        .trim();

    if(
        value === "in-progress" ||
        value === "in progress"
    ){
        return "in_progress";
    }

    if(value === "accepted"){
        return "accepted";
    }

    if(value === "completed"){
        return "completed";
    }

    if(value === "rejected"){
        return "rejected";
    }

    return "pending";

}


/* =====================================================
   STATUS TEXT
===================================================== */

function getStatusText(status){

    const normalized =
        normalizeStatus(status);

    if(normalized === "in_progress"){
        return "In Progress";
    }

    if(normalized === "accepted"){
        return "Accepted";
    }

    if(normalized === "completed"){
        return "Completed";
    }

    if(normalized === "rejected"){
        return "Rejected";
    }

    return "Pending";

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status){

    const normalized =
        normalizeStatus(status);

    if(normalized === "in_progress"){
        return "status-in-progress";
    }

    return "status-" + normalized;

}


/* =====================================================
   LOGOUT
===================================================== */

function logoutCustomer(){

    localStorage.removeItem("token");
    localStorage.removeItem("customerUser");
    localStorage.removeItem("customerLoggedIn");
    localStorage.removeItem("customerEmail");

    window.location.replace(
        "customer_signin.html"
    );

}


/* =====================================================
   LOAD CUSTOMER
===================================================== */

async function loadCustomer(){

    try{

        const response =
            await fetch(
                `${API_URL}/api/me`,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        if(response.status === 401){

            logoutCustomer();
            return;

        }

        if(
            response.ok &&
            data.success &&
            data.user
        ){

            customerNameElement.textContent =
                data.user.name ||
                "Customer";

            localStorage.setItem(
                "customerUser",
                JSON.stringify(data.user)
            );

            return;

        }

    }
    catch(error){

        console.error(
            "Could not load customer:",
            error
        );

    }


    /* FALLBACK */

    try{

        const savedUser =
            JSON.parse(
                localStorage.getItem(
                    "customerUser"
                ) || "null"
            );

        if(savedUser){

            customerNameElement.textContent =
                savedUser.name ||
                "Customer";

        }

    }
    catch(error){

        console.error(error);

    }

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    ordersContainer.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                ⏳
            </div>

            Loading your orders...

        </div>

    `;

    try{

        const response =
            await fetch(
                `${API_URL}/api/orders/mine`,
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            `Bearer ${token}`,
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        let data;

        try{

            data =
                await response.json();

        }
        catch(error){

            throw new Error(
                "The Webportify backend returned an invalid response."
            );

        }


        if(response.status === 401){

            logoutCustomer();
            return;

        }


        if(!response.ok){

            throw new Error(
                data.message ||
                `Orders request failed (${response.status}).`
            );

        }


        if(!data.success){

            throw new Error(
                data.message ||
                "Could not load your orders."
            );

        }


        allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        displayOrders(
            allOrders
        );


    }
    catch(error){

        console.error(
            "Load orders error:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="error-box">

                <h2>
                    ⚠️ Could Not Load Orders
                </h2>

                <p>
                    ${escapeHTML(
                        error.message ||
                        "Could not connect to the Webportify backend."
                    )}
                </p>

                <button
                    class="btn red-btn"
                    style="margin-top:18px;"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

        orderCount.textContent =
            "0 orders";

    }

}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders(orders){

    orderCount.textContent =
        `${orders.length} ${
            orders.length === 1
                ? "order"
                : "orders"
        }`;


    if(orders.length === 0){

        ordersContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>

                <h2>
                    No Orders Yet
                </h2>

                <p>
                    You have not purchased a website yet.
                </p>

                <a
                    href="customer_dashboard.html"
                    class="btn red-btn"
                >
                    Browse Websites
                </a>

            </div>

        `;

        return;

    }


    ordersContainer.innerHTML = `

        <div class="orders">

            ${orders.map(
                createOrderCard
            ).join("")}

        </div>

    `;

}


/* =====================================================
   CREATE ORDER CARD
===================================================== */

function createOrderCard(order){

    const orderId =
        order.id;

    const websiteType =
        order.website_type ||
        "Website";

    const purpose =
        order.purpose ||
        "Website Purchase";

    const status =
        normalizeStatus(
            order.status
        );

    const statusText =
        getStatusText(status);

    const statusClass =
        getStatusClass(status);

    const progress =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    order.progress
                ) || 0
            )
        );

    const createdDate =
        formatDate(
            order.created_at
        );

    const developerName =
        order.developer_name ||
        "Not assigned";

    const total =
        formatCurrency(
            order.total
        );


    return `

        <div
            class="order-card"
            data-name="${escapeHTML(websiteType)}"
            data-purpose="${escapeHTML(purpose)}"
            data-status="${escapeHTML(status)}"
        >

            <div class="order-top">

                <div class="order-title">

                    <div class="order-icon">
                        🌐
                    </div>

                    <div>

                        <h3>
                            ${escapeHTML(
                                websiteType
                            )}
                        </h3>

                        <div class="order-number">
                            Order #WP${escapeHTML(
                                String(orderId)
                            )}
                        </div>

                    </div>

                </div>

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHTML(statusText)}
                </span>

            </div>


            <div class="order-info">

                <div class="info-box">

                    <div class="info-label">
                        Order Date
                    </div>

                    <div class="info-value">
                        ${escapeHTML(createdDate)}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Purpose
                    </div>

                    <div class="info-value">
                        ${escapeHTML(purpose)}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Developer
                    </div>

                    <div class="info-value">
                        ${escapeHTML(developerName)}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Total
                    </div>

                    <div class="info-value">
                        ${escapeHTML(total)}
                    </div>

                </div>

            </div>


            <div class="progress-section">

                <div class="progress-top">

                    <span>
                        Project Progress
                    </span>

                    <span>
                        ${progress}%
                    </span>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        style="width:${progress}%"
                    ></div>

                </div>

            </div>


            <div class="order-bottom">

                <div>

                    <div class="total-label">
                        Order Total
                    </div>

                    <div class="total-price">
                        ${escapeHTML(total)}
                    </div>

                </div>


                <div class="order-actions">

                    <button
                        class="btn dark-btn"
                        data-order-id="${escapeHTML(
                            String(orderId)
                        )}"
                        onclick="viewOrderDetails(this.dataset.orderId)"
                    >
                        View Details
                    </button>

                    ${
                        order.developer_id
                            ? `
                                <button
                                    class="btn red-btn"
                                    data-order-id="${escapeHTML(
                                        String(orderId)
                                    )}"
                                    onclick="openOrderMessages(this.dataset.orderId)"
                                >
                                    💬 Message Developer
                                </button>
                              `
                            : ""
                    }

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   FILTER ORDERS
===================================================== */

function filterOrders(){

    const search =
        searchInput.value
            .trim()
            .toLowerCase();

    const selectedStatus =
        statusFilter.value;


    const filtered =
        allOrders.filter(
            order => {

                const websiteType =
                    String(
                        order.website_type ||
                        ""
                    ).toLowerCase();

                const purpose =
                    String(
                        order.purpose ||
                        ""
                    ).toLowerCase();

                const orderId =
                    String(
                        order.id ||
                        ""
                    ).toLowerCase();

                const status =
                    normalizeStatus(
                        order.status
                    );

                const matchesSearch =
                    !search ||
                    websiteType.includes(search) ||
                    purpose.includes(search) ||
                    orderId.includes(search);

                const matchesStatus =
                    selectedStatus === "all" ||
                    status === selectedStatus;

                return (
                    matchesSearch &&
                    matchesStatus
                );

            }
        );


    if(filtered.length === 0){

        ordersContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔍
                </div>

                <h2>
                    No Matching Orders
                </h2>

                <p>
                    Try changing your search or filter.
                </p>

            </div>

        `;

        orderCount.textContent =
            "0 orders";

        return;

    }


    displayOrders(
        filtered
    );

}


/* =====================================================
   VIEW ORDER DETAILS
===================================================== */

function viewOrderDetails(orderId){

    if(!orderId){

        alert("Order ID not found.");
        return;

    }

    localStorage.setItem(
        "selectedOrderId",
        String(orderId)
    );

    window.location.href =
        "customer_order_details.html";

}


/* =====================================================
   OPEN ORDER MESSAGES
===================================================== */

function openOrderMessages(orderId){

    if(!orderId){

        alert("Order ID not found.");
        return;

    }


    const order =
        allOrders.find(
            item =>
                String(item.id) ===
                String(orderId)
        );


    if(!order){

        alert("Order could not be found.");
        return;

    }


    if(!order.developer_id){

        alert(
            "A developer has not been assigned to this order yet."
        );

        return;

    }


    localStorage.setItem(
        "selectedOrderId",
        String(order.id)
    );


    localStorage.setItem(
        "selectedRequestId",
        String(
            order.request_id ||
            ""
        )
    );


    localStorage.setItem(
        "selectedDeveloper",
        JSON.stringify({

            id:
                order.developer_id,

            name:
                order.developer_name ||
                "Developer",

            email:
                order.developer_email ||
                ""

        })
    );


    window.location.href =
        "customer_messages.html";

}


/* =====================================================
   START
===================================================== */

loadCustomer();

loadOrders();


/* =====================================================
   LIVE REFRESH
===================================================== */

setInterval(
    loadOrders,
    10000
);

</script>
