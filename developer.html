<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webportify - Developer Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#02070d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:36px 20px;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    opacity:.55;

    background:
        linear-gradient(
            125deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 720px 0/170px 140px,

        linear-gradient(
            55deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 800px 30px/190px 160px,

        linear-gradient(
            145deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 930px 100px/170px 150px;

    filter:drop-shadow(0 0 5px #ff1744);
}

.container{
    width:770px;
    max-width:100%;

    background:rgba(12,15,21,.94);

    border:1px solid #343941;
    border-radius:24px;

    padding:40px 38px 45px;

    box-shadow:
        0 0 25px rgba(255,23,68,.08);

    position:relative;
}

.back{
    width:100%;
    height:52px;

    border:1px solid #3a3f47;
    border-radius:9px;

    background:#0c1016;
    color:#b8bec7;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
    transition:.25s;

    margin-bottom:25px;
}

.back:hover{
    border-color:#ff1744;
    color:#ff496b;
    text-shadow:0 0 12px #ff1744;

    box-shadow:
        0 0 15px rgba(255,23,68,.2);
}

.header{
    text-align:center;
    margin-bottom:32px;
}

.icon{
    font-size:45px;
    font-weight:bold;
    color:#ff1744;

    text-shadow:
        0 0 8px #ff1744,
        0 0 20px rgba(255,23,68,.7);

    margin-bottom:5px;
}

.header h1{
    color:#ff1744;
    font-size:42px;
    font-weight:700;

    text-shadow:
        0 0 8px #ff1744,
        0 0 20px rgba(255,23,68,.7);

    margin-bottom:10px;
}

.subtitle{
    color:#9ca3ad;
    margin-top:8px;
    font-size:16px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:21px;
}

.form-group{
    margin-bottom:21px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

input,
select,
textarea{
    width:100%;

    background:#0c1016;
    color:white;

    border:1px solid #363b43;
    border-radius:12px;

    outline:none;

    font-size:15px;

    transition:.2s;
}

input,
select{
    height:53px;
    padding:0 18px;
}

textarea{
    min-height:120px;
    padding:16px 18px;
    resize:vertical;
}

input::placeholder,
textarea::placeholder{
    color:#69717d;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ff1744;

    box-shadow:
        0 0 12px rgba(255,23,68,.15);
}

select{
    cursor:pointer;
}

select option{
    background:#0c1016;
    color:white;
}

.hint{
    color:#858d9a;
    font-size:12px;
    margin-top:7px;
}

.error{
    color:#ff496b;
    font-size:13px;
    margin-top:6px;
    display:none;
}

.success{
    color:#35e68a;
    font-size:13px;
    margin-top:10px;
    text-align:center;
    display:none;
}

.register-btn{
    width:100%;
    height:52px;

    border:1px solid #ff1744;
    border-radius:9px;

    background:#ff1744;
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    margin-top:5px;

    box-shadow:
        0 0 15px rgba(255,23,68,.3);

    transition:.25s;
}

.register-btn:hover{
    background:#ff3158;

    box-shadow:
        0 0 25px rgba(255,23,68,.65);

    transform:translateY(-2px);
}

.register-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

@media(max-width:650px){

    body{
        padding:20px 12px;
    }

    .container{
        width:100%;
        padding:30px 22px 35px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .header h1{
        font-size:34px;
    }

    .icon{
        font-size:40px;
    }

    .subtitle{
        font-size:14px;
    }
}
</style>

</head>

<body>

<div class="container">

```
<div class="header">

    <div class="icon">
        &lt;/&gt;
    </div>

    <h1>Developer</h1>

    <p class="subtitle">
        Join Webportify and build amazing websites.
    </p>

</div>

<form id="developerForm">

    <div class="form-row">

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <p id="emailError" class="error">
                This email is already registered.
            </p>

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label>Create Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create your password"
                minlength="4"
                required
            >

            <p class="hint">
                Your password must contain at least 4 characters.
            </p>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter your password again"
                minlength="4"
                required
            >

            <p id="passwordError" class="error">
                Passwords do not match.
            </p>

        </div>

    </div>

    <div class="form-group">

        <label>Specialization</label>

        <select id="specialization" required>

            <option value="">
                Select your specialization
            </option>

            <option>Frontend Development</option>
            <option>Backend Development</option>
            <option>Full Stack Development</option>
            <option>UI/UX Design</option>
            <option>Mobile App Development</option>

        </select>

    </div>

    <div class="form-group">

        <label>Experience</label>

        <select id="experience" required>

            <option value="">
                Select your experience
            </option>

            <option>Beginner</option>
            <option>Less than 1 year</option>
            <option>1 - 2 years</option>
            <option>3 - 5 years</option>
            <option>5+ years</option>

        </select>

    </div>

    <div class="form-group">

        <label>Skills</label>

        <input
            type="text"
            id="skills"
            placeholder="HTML, CSS, JavaScript, Java..."
            required
        >

    </div>

    <div class="form-group">

        <label>Portfolio Website</label>

        <input
            type="url"
            id="portfolio"
            placeholder="https://yourportfolio.com"
        >

    </div>

    <div class="form-group">

        <label>GitHub Profile</label>

        <input
            type="url"
            id="github"
            placeholder="https://github.com/yourusername"
        >

    </div>

    <div class="form-group">

        <label>About You</label>

        <textarea
            id="about"
            placeholder="Tell us about your development experience..."
            required
        ></textarea>

    </div>

    <button
        type="button"
        class="back"
        onclick="window.location.href='structure.html'"
    >
        ← Back
    </button>

    <button
        type="submit"
        class="register-btn"
        id="registerBtn"
    >
        Create Developer Account →
    </button>

    <p
        id="successMessage"
        class="success"
    >
        Account created successfully. Opening dashboard...
    </p>

</form>
```

</div>

<script>

/* =========================
   ONLINE WEBPORTIFY BACKEND
========================= */

const API_URL = "https://webportify.onrender.com";


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById("developerForm");

const registerBtn =
    document.getElementById("registerBtn");

const passwordError =
    document.getElementById("passwordError");

const emailError =
    document.getElementById("emailError");

const successMessage =
    document.getElementById("successMessage");


/* =========================
   REGISTER DEVELOPER
========================= */

form.addEventListener("submit", async function(event){

    event.preventDefault();

    passwordError.style.display = "none";
    emailError.style.display = "none";
    successMessage.style.display = "none";


    const name =
        document.getElementById("name").value.trim();

    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const specialization =
        document.getElementById("specialization").value;

    const experience =
        document.getElementById("experience").value;

    const skills =
        document.getElementById("skills").value.trim();

    const portfolio =
        document.getElementById("portfolio").value.trim();

    const github =
        document.getElementById("github").value.trim();

    const about =
        document.getElementById("about").value.trim();


    /* =========================
       CHECK PASSWORD
    ========================= */

    if(password !== confirmPassword){

        passwordError.style.display = "block";

        return;
    }


    /* =========================
       DISABLE BUTTON
    ========================= */

    registerBtn.disabled = true;

    registerBtn.textContent =
        "Creating Account...";


    try{

        /* =========================
           SEND DATA TO ONLINE BACKEND
        ========================= */

        const response = await fetch(
            `${API_URL}/api/auth/developer/register`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    name:name,
                    email:email,
                    password:password,

                    specialization:specialization,
                    experience:experience,
                    skills:skills,
                    portfolio:portfolio,
                    github:github,
                    about:about

                })
            }
        );


        const data =
            await response.json();


        /* =========================
           HANDLE BACKEND ERROR
        ========================= */

        if(!response.ok){

            if(
                response.status === 409 ||
                (
                    data.message &&
                    data.message
                        .toLowerCase()
                        .includes("email")
                )
            ){

                emailError.textContent =
                    data.message ||
                    "This email is already registered.";

                emailError.style.display =
                    "block";

            }else{

                alert(
                    data.message ||
                    "Unable to create developer account."
                );

            }

            registerBtn.disabled = false;
            registerBtn.textContent =
                "Create Developer Account →";

            return;
        }


        /* =========================
           SAVE JWT TOKEN
        ========================= */

        if(data.token){

            localStorage.setItem(
                "token",
                data.token
            );

        }


        /* =========================
           SAVE DEVELOPER DATA
        ========================= */

        if(data.user){

            localStorage.setItem(
                "developerUser",
                JSON.stringify(data.user)
            );

            localStorage.setItem(
                "developerEmail",
                data.user.email
            );

            sessionStorage.setItem(
                "developerEmail",
                data.user.email
            );

        }


        /* =========================
           DEVELOPER IS LOGGED IN
        ========================= */

        sessionStorage.setItem(
            "developerLoggedIn",
            "true"
        );


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        successMessage.textContent =
            "Account created successfully. Opening dashboard...";

        successMessage.style.display =
            "block";

        registerBtn.textContent =
            "Account Created ✓";


        /* =========================
           DIRECTLY OPEN DASHBOARD
        ========================= */

        setTimeout(function(){

            window.location.href =
                "developer_dashboard.html";

        },1000);


    }catch(error){

        console.error(
            "Developer registration error:",
            error
        );

        alert(
            "Cannot connect to the Webportify backend."
        );


        registerBtn.disabled = false;

        registerBtn.textContent =
            "Create Developer Account →";

    }

});

</script>

</body>
</html>
