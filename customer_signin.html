<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webportify - Customer Sign In</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#02070d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    opacity:.55;

    background:
        linear-gradient(
            125deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 720px 0/170px 140px,

        linear-gradient(
            55deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 800px 30px/190px 160px,

        linear-gradient(
            145deg,
            transparent 49%,
            #ff1744 50%,
            transparent 51%
        ) 930px 100px/170px 150px;

    filter:drop-shadow(0 0 5px #ff1744);
}

.container{
    width:430px;
    max-width:100%;
    padding:42px 38px;
    background:rgba(12,15,21,.96);
    border:1px solid #343941;
    border-radius:22px;
    box-shadow:0 0 30px rgba(255,23,68,.12);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:#ff1744;
    font-size:38px;

    text-shadow:
        0 0 8px #ff1744,
        0 0 20px rgba(255,23,68,.7);
}

.logo p{
    color:#9ca3ad;
    margin-top:10px;
    font-size:14px;
}

.field{
    margin-bottom:20px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

input{
    width:100%;
    height:52px;
    padding:0 16px;
    background:#0c1016;
    border:1px solid #363b43;
    border-radius:11px;
    color:white;
    outline:none;
    font-size:15px;
    transition:.2s;
}

input::placeholder{
    color:#69717d;
}

input:focus{
    border-color:#ff1744;

    box-shadow:
        0 0 12px rgba(255,23,68,.18);
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

button{
    flex:1;
    height:50px;
    border-radius:9px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
}

.signin{
    border:1px solid #ff1744;
    background:#ff1744;
    color:white;

    box-shadow:
        0 0 15px rgba(255,23,68,.3);
}

.signin:hover{
    background:#ff3158;

    box-shadow:
        0 0 25px rgba(255,23,68,.6);

    transform:translateY(-2px);
}

.signin:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.back{
    border:1px solid #3a3f47;
    background:#0c1016;
    color:#b8bec7;
}

.back:hover{
    border-color:#ff1744;
    color:#ff1744;
}

#message{
    min-height:20px;
    text-align:center;
    margin-top:18px;
    font-size:13px;
}

.error{
    color:#ff496b;
}

.success{
    color:#4dff88;
}

@media(max-width:500px){

    .container{
        width:92%;
        padding:35px 25px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

```
<div class="logo">

    <h1>Webportify</h1>

    <p>Customer Sign In</p>

</div>


<form id="loginForm">

    <div class="field">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

    </div>


    <div class="field">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

    </div>


    <div class="buttons">

        <button
            type="button"
            class="back"
            id="backButton"
        >
            ← Back
        </button>


        <button
            type="submit"
            class="signin"
            id="signinButton"
        >
            Sign In →
        </button>

    </div>


    <p id="message"></p>

</form>
```

</div>

<script>

/* =====================================================
   WEBPORTIFY BACKEND
===================================================== */

const API_URL =
    "https://webportify.onrender.com";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const signinButton =
    document.getElementById("signinButton");

const backButton =
    document.getElementById("backButton");


/* =====================================================
   BACK BUTTON
===================================================== */

backButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "Structure.html";

    }
);


/* =====================================================
   CUSTOMER LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        message.textContent = "";
        message.className = "";


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        /* =========================
           VALIDATION
        ========================= */

        if(!email || !password){

            message.textContent =
                "Please enter your email and password.";

            message.className =
                "error";

            return;

        }


        /* =========================
           START LOGIN
        ========================= */

        signinButton.disabled = true;

        signinButton.textContent =
            "Signing In...";

        message.textContent =
            "Checking your account...";


        try{

            /* =========================
               SEND LOGIN REQUEST
            ========================= */

            const response =
                await fetch(
                    API_URL +
                    "/api/auth/customer/login",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:email,

                            password:password

                        })
                    }
                );


            /* =========================
               READ RESPONSE
            ========================= */

            let data;

            try{

                data =
                    await response.json();

            }
            catch(jsonError){

                throw new Error(
                    "The backend returned an invalid response."
                );

            }


            /* =========================
               HTTP ERROR
            ========================= */

            if(!response.ok){

                throw new Error(
                    data.message ||
                    "Invalid email or password."
                );

            }


            /* =========================
               LOGIN RESPONSE
            ========================= */

            if(!data.success){

                throw new Error(
                    data.message ||
                    "Login failed."
                );

            }


            /* =========================
               CHECK TOKEN
            ========================= */

            if(!data.token){

                throw new Error(
                    "Login succeeded, but no authentication token was received."
                );

            }


            /* =========================
               SAVE TOKEN
            ========================= */

            localStorage.setItem(
                "token",
                data.token
            );


            /* =========================
               SAVE CUSTOMER
            ========================= */

            if(data.user){

                localStorage.setItem(
                    "customerUser",
                    JSON.stringify(data.user)
                );


                if(data.user.email){

                    localStorage.setItem(
                        "customerEmail",
                        data.user.email
                    );

                }

            }
            else{

                localStorage.setItem(
                    "customerEmail",
                    email
                );

            }


            /* =========================
               LOGIN STATUS
            ========================= */

            localStorage.setItem(
                "customerLoggedIn",
                "true"
            );


            /* =========================
               REMOVE DEVELOPER SESSION
            ========================= */

            sessionStorage.removeItem(
                "developerLoggedIn"
            );

            sessionStorage.removeItem(
                "developerEmail"
            );


            /* =========================
               SUCCESS
            ========================= */

            message.textContent =
                "Login successful! Opening dashboard...";

            message.className =
                "success";


            /* =========================
               OPEN DASHBOARD
            ========================= */

            setTimeout(
                function(){

                    window.location.replace(
                        "customer_dashboard.html"
                    );

                },
                700
            );

        }
        catch(error){

            console.error(
                "Customer login error:",
                error
            );


            message.className =
                "error";


            /* =========================
               CONNECTION ERROR
            ========================= */

            if(
                error.name === "TypeError" ||
                error.message
                    .toLowerCase()
                    .includes("failed to fetch")
            ){

                message.textContent =
                    "Cannot connect to the Webportify backend. Check your Render server.";

            }
            else{

                message.textContent =
                    error.message ||
                    "Invalid email or password.";

            }

        }
        finally{

            signinButton.disabled = false;

            signinButton.textContent =
                "Sign In →";

        }

    }
);

</script>

</body>

</html>
